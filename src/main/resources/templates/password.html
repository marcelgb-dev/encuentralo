<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Cambiar Contraseña - Encuentralo</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hanken Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f9fb;
            padding: 1.5rem;
        }

        .card {
            width: 100%;
            max-width: 28rem;
            background: #fff;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(30, 41, 59, 0.05);
        }

        .card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #091426;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .card .subtitulo {
            color: #505f76;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 15px;
        }

        .icono-header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .icono-header .material-symbols-outlined {
            font-size: 48px;
            color: #091426;
        }

        .mensaje-error {
            background: #ffdad6;
            color: #ba1a1a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 14px;
        }

        .mensaje-exito {
            background: #dcfce7;
            color: #16a34a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 14px;
        }

        .campo {
            margin-bottom: 1.25rem;
        }

        .campo label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #45474c;
            margin-bottom: 6px;
        }

        .campo input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #c5c6cd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            color: #191c1e;
            background: #fff;
            transition: border-color 150ms;
            outline: none;
        }

        .campo input:focus {
            border-color: #091426;
        }

        .campo input::placeholder {
            color: #75777d;
        }

        .campo .hint {
            font-size: 12px;
            color: #75777d;
            margin-top: 4px;
        }

        .campo .error-inline {
            display: none;
            color: #ba1a1a;
            font-size: 12px;
            margin-top: 4px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: #091426;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 150ms;
            margin-top: 0.75rem;
        }

        .btn-submit:hover {
            background: #1e293b;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .volver {
            text-align: center;
            margin-top: 2rem;
            font-size: 14px;
        }

        .volver a {
            color: #091426;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icono-header">
            <span class="material-symbols-outlined">lock_reset</span>
        </div>
        <h1>Cambiar Contraseña</h1>
        <p class="subtitulo">Introduce tu contraseña actual y la nueva que deseas usar.</p>

        <div th:if="${error}" class="mensaje-error" th:text="${error}"></div>
        <div th:if="${exito}" class="mensaje-exito" th:text="${exito}"></div>

        <form th:action="@{/cambiar_contrasena}" method="post" onsubmit="return validarForm()">
            <div class="campo">
                <label>Contraseña actual</label>
                <input type="password" name="contrasenaAntigua" placeholder="Tu contraseña actual" required>
            </div>

            <div class="campo">
                <label>Nueva contraseña</label>
                <input type="password" name="contrasenaNueva" id="nueva" placeholder="Nueva contraseña" required>
            </div>

            <div class="campo">
                <label>Repetir nueva contraseña</label>
                <input type="password" name="contrasenaVerificar" id="verificar"
                    placeholder="Repite la nueva contraseña" required>
                <p id="error-match" class="error-inline">Las contraseñas no coinciden.</p>
            </div>

            <button type="submit" class="btn-submit">Cambiar Contraseña</button>
        </form>

        <div class="volver">
            <a href="javascript:history.back()">← Volver</a>
        </div>
    </div>

    <script>
        function validarForm() {
            var nueva = document.getElementById('nueva').value;
            var verificar = document.getElementById('verificar').value;
            var error = document.getElementById('error-match');
            if (nueva !== verificar) {
                error.style.display = 'block';
                return false;
            }
            error.style.display = 'none';
            return true;
        }
    </script>
</body>

</html>
